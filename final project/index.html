<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>LaunchPad</h1>
    <button id="theme-btn">Toggle Theme</button>
  </header>

  <main>
    <section class="hero">
      <h2>Build faster. Launch smarter.</h2>
      <p>Helping startup teams turn ideas into real products.</p>
      <button id="learn-more-btn">Learn More</button>
    </section>

    <section class="section">
      <h2>Who We Are</h2>
      <p id="about-text">We help founders plan, build, and launch with confidence.</p>
    </section>

    <section class="section">
      <h2>Sponsors</h2>
      <div id="sponsors"></div>
    </section>

    <section class="section">
      <h2>Coming Soon</h2>
      <ul id="features-list"></ul>
    </section>

    <section class="section">
      <h2>Team</h2>
      <div id="team-list"></div>
    </section>

    <section class="section">
      <h2>Join the Waitlist</h2>
      <form id="waitlist-form">
        <input id="name-input" type="text" placeholder="Name">
        <input id="email-input" type="email" placeholder="Email">
        <button type="submit">Join</button>
      </form>
      <p id="form-message"></p>
    </section>

    <section class="section">
      <h2>Latest Posts</h2>
      <p id="status"></p>
      <div id="posts"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
